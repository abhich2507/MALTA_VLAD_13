#########################################################################################
####### Tell us about yourself
comments = This is the DEFAULT simulation flag. Please customize as desired.
#########################################################################################
####### Available Geometry Presets: MALTA - MALTA sensor implementation, PCB - implementation of a single rotated PCB stack
preDefinedGeometryFlag = MALTA
#########################################################################################
####### Placement of the detector in the world volume. Values are in cm and are offsets from the golbal (0,0,0) point
detectorXOffset = 5.
detectorYOffset = 5.
detectorZOffset = 5.
#########################################################################################
####### Pixel Size [um] # TODO: NOt yet implemented
pixelSize = 36.4
#########################################################################################
####### Available world volume materials: G4_Galactic for vacuum; G4_Air for air
outsideMaterial = G4_Galactic
#########################################################################################
####### Particle source geometry. Available presets: pencil, circle, rectangle
beamGeometry = pencil
#########################################################################################
#######Position of the pencil beam in cm as an off-set from the global (0,0,0) point.
beamXOffset = 5.
beamYOffset = 5.
beamZOffset = - 10.
#########################################################################################
####### Configuration of spherical source if enabled. All values are in mm
sourceRadius = 18.6368
sourceXOffset = 0.
sourceYOffset = 0.
sourceZOffset = - 11.
#########################################################################################
####### Spill size. (# of particles per event)
particleCount = 1
#########################################################################################
####### Number of events to simulate. Value is used as part of the run macro
#TODO: Add check for average number of events per thread. If too few events num of threads needs to be according
numEvents = 100000
#########################################################################################
####### Primary particle type. Custom ions implemented currently: K40, Cs137
particleType = proton
#########################################################################################
####### Primary particle energy in GeV if int or invokes an energy distribution if string.
particleEnergy = 120
#########################################################################################
####### Momemntum of the primary particle in the three axes.
particleMomentumX = 0.
particleMomentumY = 0.
particleMomentumZ = 1.
#########################################################################################
####### Enable/ disable EMPhysics. By default, EMPhysics_option4() physics preset list is used
EMPhysics = true
#########################################################################################
####### Enable/ disable decayPhysics. Should be enabled only when simmulating radioactive sources
hadronPhysics = true
#########################################################################################
####### Enable/disable the use of the Geant4 cuts.
setGEANT4Cuts = true
#########################################################################################
####### Value of the GEANT4 cut in um. Implementation sets by default the value for gamma, e- and e+ particles.
GEANT4CutValue = 10
#########################################################################################
####### Simulation output path
outputPathLocal = Results
outputPathNAF = Results
#########################################################################################
####### GEANT4 macro file to run locally. TODO: Add naf paths too and make the flag pushable to git
macroFileLocal = run.mac
macroFileNAF = run.mac
#########################################################################################
####### Number of Threads. Should match the number of cores. Optimization between physical/ virtual cores
numThreadsLocal = 6
numThreadsNAF = 12
#########################################################################################
####### Run mode. local or naf. #### Used for passing the command line argv
runMode = local 
#########################################################################################