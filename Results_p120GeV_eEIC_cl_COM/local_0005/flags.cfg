#########################################################################################
####### Geometry presets: MALTA, MALTASPS, PCB, MULTIMALTA (needs geoFile)
preDefinedGeometryFlag = MULTIMALTA
largeScaleFlag = EIC_FMT
geoFile = geo_X4Y1Z2.csv
#########################################################################################
####### Detector placement in the world volume [cm], offset from the global (0,0,0)
detectorXOffset = 0.
detectorYOffset = 0.
detectorZOffset = 0.
#########################################################################################
####### Pixel size [mm]
pixelSize = 0.0364
#########################################################################################
####### Sensitive area X/Y [cm] and depth [um]
detectorSizeX = 1.86368
detectorSizeY = 1.86368
detectorDepth = 29.1
#########################################################################################
####### Analytical charge collection model sigma X/Y [um]
CCModelSigmaX = 4.3
CCModelSigmaY = 4.3
#########################################################################################
####### Available world volume materials: G4_Galactic for vacuum; G4_Air for air
outsideMaterial = G4_Galactic
#########################################################################################
####### Beam geometry: pencil, circle, rectangle, gaussian, granularBeam, DColScanX/Y
####### gaussian uses gausSmearingX/Y/Z (sigma in cm)
beamGeometry = gaussian
gausSmearingX = 0.05
gausSmearingY = 0.05
gausSmearingZ = 10
#########################################################################################
####### Beam position [cm], offset from the global (0,0,0)
#beamXOffset = 2.79552   # S1 center
beamXOffset = 1.86369
beamYOffset = 0.
beamZOffset = -100.0
#########################################################################################
####### Spherical source radius [mm] (used by circle/rectangle geometries)
sourceRadius = 18
sourceRadiusX = 74.4744
sourceRadiusY = 18.564
#########################################################################################
####### Particles per event (fallback when the Poisson background mode is off)
particleCount = 11
#########################################################################################
####### Number of events to simulate
numEvents = 200000
#########################################################################################
####### Time offset of particles in the same spill [ns] (non-EIC mode)
intraSpillOffset = 0
#########################################################################################
####### Beam veto / particle gun period [ns]
beamVeto = 2000
#########################################################################################
####### Primary particle type
particleType = proton
#########################################################################################
####### Signal particle energy [GeV]
particleEnergy = 120
#########################################################################################
####### Background particle (used when bkgMixTypes is empty)
bkgparticleType = e-
bkgparticleEnergy = 0.01   # GeV, fixed-energy mode only
####### Background energy mode: none = fixed bkgparticleEnergy; CB = sample |p| from Crystal Ball
bkgenergyDistribution = CB
####### Crystal Ball parameters "alpha,n,mean,sigma" for background |p| [GeV/c] (CB mode, single type)
bkgMomentumCB = 3.73861,1.41557,0.174051,0.00104961
####### Background particle mix (comma-separated GEANT4 names). Non-empty = overrides bkgparticleType for bkg
bkgMixTypes = e-,e+
####### Relative weights of the mix particles = sensor hit counts (e- 5394, e+ 3450)
bkgMixWeights = 5394,3450
####### Crystal Ball "alpha,n,mean,sigma" per mix particle, ';'-separated, same order as bkgMixTypes
bkgMixCB = 0.06522609,1.94487100,0.0026017010,0.00029187658;0.06234096,1.96721006,0.0017759929,0.00055197457
#########################################################################################
####### Background vertex box [cm]. Direction is aimed so particles land on a sensor plane.
bkgXMin = 1.79552
bkgXMax = 3.79552 
bkgYMin = -1.0
bkgYMax = 1.0
bkgZMin = -100.0
bkgZMax = 110.0    # 100 cm upstream of plane0 (z=0) and downstream of plane1 (z=10)
####### Background rate: Poisson mean of TOTAL background particles per event (-1 = use particleCount)
####### = 0.198 per sensor x 8 sensors
bkgRateMean = 2.0
#########################################################################################
####### Signal momentum direction
particleMomentumX = 0.
particleMomentumY = 0.
particleMomentumZ = 1.
#########################################################################################
####### ITK pile-up input (min bias)
itkEnable = false
pileUpScale = 1
itkInput = pixBarrel_occ
itkLayer = 0
itkZ = 0
#########################################################################################
####### EM physics (EMPhysics_option4 preset)
EMPhysics = true
#########################################################################################
####### Hadron physics (needed for radioactive sources)
hadronPhysics = true
#########################################################################################
####### Tungsten absorber plate upstream of the DUT [cm]
dutTungstenAbsorberFlag = false
absorberThickness = 3.2
#########################################################################################
####### Enable GEANT4 production cuts
setGEANT4Cuts = true
#########################################################################################
####### GEANT4 cut value [um] for gamma / e- / e+
GEANT4CutValue = 1
#########################################################################################
####### Simulation output path
outputPathLocal = Results
outputPathNAF = Results
####### Forced output run directory number (local_NNNN); -1 = auto-increment
runDirNumber = 5
#########################################################################################
####### GEANT4 macro to run
macroFileLocal = run.mac
#macroFileLocal = vis.mac   # uncomment for interactive visualization
macroFileNAF = run.mac
#########################################################################################
####### Number of threads (local / NAF)
numThreadsLocal = 6
numThreadsNAF = 12
#########################################################################################
####### Import geometry from gdml
gdmlBool = false
gdmlStr = ../LHCfArm2geometry.gdml
#########################################################################################
####### Verbosity per class
verbosePL = false
verbosePG = false
verboseSD = false
verboseSA = false
